<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SBA 2 - Responsive & Accessible Web Page</title>

    <!-- for roboto google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <!--  Added bootstrap icons-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <!-- style.css -->
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <!-- Header -->
    <header id="header-container">
        <div class="container d-flex justify-content-between items-center mx-auto">

            <a id="brand-logo" href="#">
                Creativo
            </a>

            <nav class="d-flex items-center gap-3">
                <ul id="nav-list" class="gap-3 list-style-none capitalize">
                    <li>
                        <a aria-current="page" class="nav-link" href="#home">home</a>
                    </li>
                    <li>
                        <a class="nav-link" href="#about">About</a>
                    </li>
                    <li>
                        <a class="nav-link" href="#services">Services</a>
                    </li>
                    <li><a class="nav-link" href="#contact">Contact</a></li>

                </ul>
            </nav>



            <ul id="social-links" class="d-flex items-center list-style-none gap-3">
                <li>
                    <a href="#">
                        <i class="bi bi-twitter-x"></i>
                    </a>
                </li>

                <li>
                    <a href="#">
                        <i class="bi bi-facebook"></i>
                    </a>
                </li>

                <li>
                    <a href="#">
                        <i class="bi bi-instagram"></i>
                    </a>
                </li>

                <li>
                    <a href="#">
                        <i class="bi bi-linkedin"></i>
                    </a>
                </li>
                <i id="hamburger-btn" class="bi bi-list"></i>
            </ul>
        </div>
    </header>


    <main>

        <!-- About Us Section  -->
        <section id="about-us"></section>

        <!-- Services Section  -->
        <section id="services"></section>

        <!-- Contact Form Section -->
        <section id="contact-form"></section>

    </main>

    <!-- Footer -->
    <footer></footer>

</body>

</html>
